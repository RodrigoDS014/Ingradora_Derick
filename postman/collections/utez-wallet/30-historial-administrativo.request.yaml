$kind: http-request
name: '30 historial administrativo'
order: 30000
method: GET
url: '{{baseUrl}}/admin/students/{{studentId}}/movements'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Solo movimientos del alumno consultado", () => pm.expect(pm.response.json().every(item => item.studentId === pm.collectionVariables.get("studentId"))).to.eql(true));
