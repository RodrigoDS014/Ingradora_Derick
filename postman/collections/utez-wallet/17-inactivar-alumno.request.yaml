$kind: "http-request"
name: "17 inactivar alumno"
order: 17000
method: "PATCH"
url: "{{baseUrl}}/admin/students/{{studentId}}/status"
headers:
  - key: "Content-Type"
    value: "application/json"
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{adminToken}}"
body:
  type: json
  content: |-
    {"status": "INACTIVO"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
