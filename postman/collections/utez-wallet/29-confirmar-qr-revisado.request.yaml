$kind: http-request
name: '29 confirmar qr revisado'
order: 29000
method: POST
url: '{{baseUrl}}/tokens/access/redeem'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"token":"{{inspectionQr}}"}
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Revisar no consumió el QR", () => pm.expect(pm.response.json().kind).to.eql("ACCESO"));
