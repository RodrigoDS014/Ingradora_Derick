$kind: "http-request"
name: "07 rechaza monto negativo"
order: 7000
method: "POST"
url: "{{baseUrl}}/wallet/topups"
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "Idempotency-Key"
    value: "{{runId}}-negative"
body:
  type: json
  content: |-
    {"amountCents": -1000}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 422", () => pm.response.to.have.status(422));
      pm.test("INVALID_AMOUNT", () => pm.expect(pm.response.json().code).to.eql("INVALID_AMOUNT"));
