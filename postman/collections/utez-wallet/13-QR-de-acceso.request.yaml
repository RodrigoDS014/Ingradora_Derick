$kind: "http-request"
name: "13 QR de acceso"
order: 13000
method: "POST"
url: "{{baseUrl}}/tokens/access"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("accessQr", pm.response.json().token);
