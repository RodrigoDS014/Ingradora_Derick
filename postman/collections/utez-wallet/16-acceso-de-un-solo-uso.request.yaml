$kind: "http-request"
name: "16 acceso de un solo uso"
order: 16000
method: "POST"
url: "{{baseUrl}}/tokens/access/redeem"
headers:
  - key: "Content-Type"
    value: "application/json"
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{adminToken}}"
body:
  type: json
  content: |-
    {"token": "{{accessQr}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 409", () => pm.response.to.have.status(409));
      pm.test("TOKEN_USED", () => pm.expect(pm.response.json().code).to.eql("TOKEN_USED"));
